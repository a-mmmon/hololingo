name: ar_language_app
description: Object scanning vocabulary learning app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5

  # ML Kit Image Labeling — working version
  google_mlkit_image_labeling: ^0.12.0

  # Text-to-speech
  flutter_tts: ^3.8.5

  # Local database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Shared prefs
  shared_preferences: ^2.2.2

  # Path provider
  path_provider: ^2.1.2

  # HTTP for dictionary API
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/detect.tflite
    - assets/labelmap.txt
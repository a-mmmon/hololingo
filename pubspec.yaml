name: ar_language_app
description: Object scanning vocabulary learning app
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.0   # check latest on pub.dev, was on major 12 before
  # Camera / on-device object detection
  camera: ^0.11.0+2
  # google_mlkit_image_labeling: ^0.12.0   # uncomment if detector_service.dart imports this
  # tflite_flutter: ^0.10.4                # uncomment if detector_service.dart imports this
  # Networking (dictionary lookups, etc.)
  http: ^1.2.1
  # AR placement
  vector_math: ^2.1.4
  arcore_flutter_plugin: ^0.1.0
  # TTS + local prefs (theme toggle only — not word storage)
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.2
  firebase_ai: ^3.15.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  # If DetectorService still needs a bundled tflite model, uncomment:
  # assets:
  #   - assets/detect.tflite
  #   - assets/labelmap.txt
name: ar_language_app

description: Object scanning vocabulary learning app

publish_to: "none"

version: 1.0.0+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: 4.14.0
  firebase_auth: 6.6.1
  cloud_firestore: 6.9.0
  in_app_purchase: ^3.2.3

  camera: ^0.11.0+2
  http: ^1.2.1
  vector_math: ^2.1.4
  arkit_plugin: ^1.5.0
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  firebase_ai: ^3.15.0
  tflite_flutter: ^0.12.1
  image: ^4.9.2
  share_plus: ^11.1.0
  image_picker: ^1.2.3
  sensors_plus: ^7.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/hololingo.png
    - assets/Models/best.tflite
    - assets/dictionary/a/
    - assets/dictionary/b/
    - assets/dictionary/c/
    - assets/dictionary/d/
    - assets/dictionary/e/
    - assets/dictionary/f/
    - assets/dictionary/g/
    - assets/dictionary/h/
    - assets/dictionary/i/
    - assets/dictionary/j/
    - assets/dictionary/k/
    - assets/dictionary/l/
    - assets/dictionary/m/
    - assets/dictionary/n/
    - assets/dictionary/o/
    - assets/dictionary/p/
    - assets/dictionary/q/
    - assets/dictionary/r/
    - assets/dictionary/s/
    - assets/dictionary/t/
    - assets/dictionary/u/
    - assets/dictionary/v/
    - assets/dictionary/w/
    - assets/dictionary/x/
    - assets/dictionary/y/
    - assets/dictionary/z/

    - assets/gobot.png
    - assets/mascot/parts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/hololingo.png"
